name: Prebuild & Release

on:
  push:
    tags:
      - 'v*'
  # Manual trigger to validate the build matrix on all platforms WITHOUT
  # publishing (the publish job is gated on a tag ref below). Use this to
  # confirm Windows/Linux compile green before cutting a release tag.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  # Build the native binary on every target platform and upload it as an
  # artifact. NOTHING is published here — a failure on any platform must
  # prevent the whole release (see the `publish` job's `needs: build`).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: static single-file build — Metal (embedded) covers GPU.
          - os: macos-latest
            platform: darwin
            arch: arm64
          - os: macos-latest-large
            platform: darwin
            arch: x64
          # Linux/Windows: backend-DL builds (LLAMA_NODE_BACKEND_DL). The
          # package ships llama/ggml as shared libs plus runtime-loadable
          # backends: one CPU module per microarchitecture (picked by score
          # at runtime) and a Vulkan module that is skipped gracefully when
          # the system has no Vulkan loader. Mirrors upstream llama.cpp's
          # own release builds.
          # Pinned (not ubuntu-latest): the published linux binary's minimum
          # glibc comes from the build image. ubuntu-latest migrates to
          # Ubuntu 26 from 2026-10-19, which would silently raise the glibc
          # floor for everyone installing the prebuild. Bump deliberately.
          - os: ubuntu-24.04
            platform: linux
            arch: x64
            backends: dl-vulkan
          - os: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            backends: dl-vulkan
          - os: windows-latest
            platform: win32
            arch: x64
            backends: dl-vulkan

    runs-on: ${{ matrix.os }}

    env:
      # Windows Vulkan SDK pin — keep in step with what the vendored
      # llama.cpp's own CI uses (vendor/llama.cpp/.github/workflows).
      VULKAN_VERSION: 1.4.357.0

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies (skip native build)
        run: npm install --ignore-scripts

      # Vulkan is only a BUILD-time dependency (glslc + headers); at runtime
      # ggml dlopens the system Vulkan loader and falls back to CPU when it
      # is missing. Package set mirrors upstream llama.cpp's ubuntu release
      # job (gcc-14 is needed by the armv9.2 CPU variant).
      - name: Install Vulkan build dependencies (Linux)
        if: matrix.backends == 'dl-vulkan' && matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gcc-14 g++-14 glslc libvulkan-dev spirv-headers
          echo "CC=gcc-14" >> "$GITHUB_ENV"
          echo "CXX=g++-14" >> "$GITHUB_ENV"

      # Same silent-install incantation as upstream llama.cpp CI.
      - name: Install Vulkan SDK (Windows)
        if: matrix.backends == 'dl-vulkan' && matrix.platform == 'win32'
        shell: pwsh
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\$env:VULKAN_VERSION\bin"

      - name: Build native module
        if: matrix.platform != 'win32'
        env:
          # Read by CMakeLists.txt (cmake-js does not reliably forward -D
          # vars); empty means off.
          LLAMA_NODE_BACKEND_DL: ${{ matrix.backends == 'dl-vulkan' && '1' || '' }}
          LLAMA_NODE_VULKAN: ${{ matrix.backends == 'dl-vulkan' && '1' || '' }}
        run: npx cmake-js compile --release -r node -v $(node -v | tr -d v)

      # Windows builds in a short directory: MSBuild's FileTracker fails with
      # FTK1011 once the vulkan-shaders-gen ExternalProject's try-compile
      # scratch paths exceed MAX_PATH (260 chars, not lifted by the long-path
      # registry key) — the default D:\a\<repo>\<repo>\build prefix alone eats
      # most of the budget. Build under RUNNER_TEMP and copy the result back
      # to build/Release, where the loader, unit tests and staging expect it.
      - name: Build native module (Windows, short build dir)
        if: matrix.platform == 'win32'
        shell: bash
        env:
          LLAMA_NODE_BACKEND_DL: ${{ matrix.backends == 'dl-vulkan' && '1' || '' }}
          LLAMA_NODE_VULKAN: ${{ matrix.backends == 'dl-vulkan' && '1' || '' }}
        run: |
          OUT="${RUNNER_TEMP//\\//}/b"
          npx cmake-js compile --release -r node -v $(node -v | tr -d v) --out "$OUT"
          mkdir -p build
          cp -R "$OUT/Release" build/Release

      # The loader prefers the published platform packages from
      # optionalDependencies; drop them so the tests exercise the binary
      # built above, not a previous release.
      - name: Remove prebuilt binaries so tests load the fresh build
        shell: bash
        run: rm -rf node_modules/@llama-cpp-node-api

      # Unit tests need no model file; they load the fresh addon and check
      # the full JS/native surface. Publishing is gated on this via the
      # publish job's `needs: build` — a failure on any platform blocks
      # the release.
      - name: Run unit tests
        run: npm run test:unit

      # Backend-DL builds stage the whole runtime set (addon + shared
      # llama/ggml libs + loadable backends, all placed next to the addon by
      # the CMake POST_BUILD step); static builds stage just the .node.
      - name: Stage binaries for upload
        shell: bash
        run: |
          set -euo pipefail
          NODE_FILE=$(find build -name "llama_node.node" -type f | head -1)
          if [ -z "$NODE_FILE" ]; then
            echo "::error::Could not find llama_node.node"
            exit 1
          fi
          OUT_DIR=$(dirname "$NODE_FILE")
          mkdir -p artifact
          cp "$NODE_FILE" artifact/llama_node.node
          find "$OUT_DIR" -maxdepth 1 -type f \
            \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) \
            -exec cp {} artifact/ \;
          # Two separate ls calls: `ls a b` fails when EITHER operand is
          # missing, and exactly one of the two patterns can ever match
          # (libggml-*.so on Linux, ggml-*.dll on Windows).
          if [ -n "${LLAMA_NODE_BACKEND_DL:-}" ] && ! ls artifact/libggml-* >/dev/null 2>&1 && ! ls artifact/ggml-*.dll >/dev/null 2>&1; then
            echo "::error::backend-DL build produced no backend libraries"
            exit 1
          fi
          ls -la artifact
        env:
          LLAMA_NODE_BACKEND_DL: ${{ matrix.backends == 'dl-vulkan' && '1' || '' }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}-${{ matrix.arch }}
          path: artifact/
          if-no-files-found: error
          retention-days: 1

  # Runs only if ALL five build jobs succeeded. Publishes every platform
  # package + the meta package and creates the single GitHub release.
  # Because this is one job, there is no race to create the release, and
  # because it `needs: build`, a partial build never publishes anything.
  publish:
    needs: build
    # Only publish on a real tag push. A manual workflow_dispatch run builds
    # the full matrix but skips this job, so you can dry-run the Windows/Linux
    # compile without publishing anything or consuming a version number.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Download all platform binaries
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Stage binaries into packages and build release tarballs
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_VERSION=${PACKAGE_VERSION}" >> "$GITHUB_ENV"
          mkdir -p release
          for triple in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            SRC_DIR="artifacts/binary-${triple}"
            if [ ! -f "$SRC_DIR/llama_node.node" ]; then
              echo "::error::Missing binary for ${triple} — refusing to publish a partial release"
              exit 1
            fi
            # Whole runtime set: the addon plus, for backend-DL platforms,
            # the shared llama/ggml libs and loadable backend modules.
            cp "$SRC_DIR"/* "npm/${triple}/"
            mkdir -p staging/build/Release
            cp "$SRC_DIR"/* staging/build/Release/
            tar -czf "release/llama-cpp-node-api-v${PACKAGE_VERSION}-napi-v8-${triple}.tar.gz" \
              -C staging build/Release
            rm -rf staging
          done

      # Pull this version's section out of CHANGELOG.md for the release
      # notes. Runs BEFORE any npm publish: a bumped version whose changelog
      # section is missing fails the release while it is still a no-op.
      - name: Extract release notes from CHANGELOG.md
        run: node scripts/extract-changelog.js "$PACKAGE_VERSION" > release_notes.md

      # Skip versions that are already on the registry so a re-run of a
      # partially failed release resumes where it stopped instead of dying
      # on the first "cannot publish over previously published version".
      - name: Publish platform packages
        shell: bash
        run: |
          set -euo pipefail
          for triple in darwin-arm64 darwin-x64 linux-x64 linux-arm64 win32-x64; do
            if npm view "@llama-cpp-node-api/${triple}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
              echo "@llama-cpp-node-api/${triple}@${PACKAGE_VERSION} already published — skipping"
              continue
            fi
            echo "Publishing @llama-cpp-node-api/${triple}"
            ( cd "npm/${triple}" && npm publish --access public --provenance )
          done

      - name: Publish meta package
        shell: bash
        run: |
          set -euo pipefail
          if npm view "llama-cpp-node-api@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "llama-cpp-node-api@${PACKAGE_VERSION} already published — skipping"
          else
            npm publish --access public --provenance
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.tar.gz
          body_path: release_notes.md
          draft: false
          fail_on_unmatched_files: true
